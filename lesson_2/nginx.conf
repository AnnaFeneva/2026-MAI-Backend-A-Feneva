worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       C:/nginx-1.28.2/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;


    upstream app_server {
        server 127.0.0.1:8000;  # порт твоего WSGI-сервера
    }

    server {
        listen 8080;
        server_name localhost;

        # Статика
        location /public/ {
            root C:/2026-MAI-Backend-A-Feneva/lesson_2;
            autoindex on;
        }

        # Проксирование на WSGI
        location /gunicorn/ {
            proxy_pass http://app_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}